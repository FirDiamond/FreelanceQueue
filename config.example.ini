# FreelanceQueue configuration template.
#
# Copy this file over config.ini to change anything. With no config.ini at all
# the app still runs on the defaults below and writes email to data/outbox/,
# so a fresh clone is immediately demoable.
#
# config.ini is gitignored and holds your DB and SMTP passwords - keep it out
# of version control.

[db]
# MySQL / MariaDB connection. XAMPP's MariaDB defaults to user "root" with an
# empty password. Create the database first (see README), then point here.
host = 127.0.0.1
port = 3306
name = freelancequeue
user = root
pass =

[smtp]
# Out of the box this is false and every notification is written to
# data/outbox/<timestamp>-<event>-<recipient>.eml as a real RFC 822 message.
# Turn it on to send real mail (requires PHPMailer - see README).
enabled  = false
host     = smtp.gmail.com
port     = 587
use_tls  = true
username =
password =
from_name = FreelanceQueue

[app]
# Send "almost your turn" when this many people or fewer are ahead.
notify_when_ahead = 2
# The address clients actually type; ticket links in emails are built from it.
base_url = http://127.0.0.1:8000
# Prefix for every amount shown.
currency = Rp
# true ONLY when served over HTTPS, otherwise the browser drops the session
# cookie and nobody can log in.
cookie_secure = false

[server]
host = 0.0.0.0
port = 8000
threads = 8
behind_proxy = false

[security]
# Optional. Only used if the app signs anything; PHP native sessions do not
# need it. Leave blank and the app runs fine.
secret_key =
